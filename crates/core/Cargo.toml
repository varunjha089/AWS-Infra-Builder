[package]
name = "aib-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AWS Infra Builder core: the design model, CIDR arithmetic, design checks, the .aib text language and templates"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
