[package]
name = "aws-infra-builder-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AWS Infra Builder: draw AWS infrastructure on a canvas, check it while drawing, turn it into real resources"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
aib-core = { path = "../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tauri-plugin-dialog = "2"
