[package]
name = "aws-infra-builder-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AWS Infra Builder: draw AWS infrastructure on a canvas, check it while drawing, turn it into real resources"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
aib-core = { path = "../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tauri-plugin-dialog = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
aws-config = { version = "1", features = ["behavior-version-latest", "sso"] }
aws-sdk-ec2 = "1"
aws-sdk-sts = "1"
aws-credential-types = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
ureq = "3"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
